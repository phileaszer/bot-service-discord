<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel | Page introuvable</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/sentinel-mark.png" type="image/png">
  <script>
    (() => {
      try {
        document.documentElement.dataset.theme = localStorage.getItem('sentinel-site-theme') === 'western' ? 'western' : 'sentinel';
      } catch (error) {
        document.documentElement.dataset.theme = 'sentinel';
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20260822-4">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Sentinel">
      <img src="assets/sentinel-mark.png" alt="">
      <span>Sentinel</span>
    </a>
    <div class="header-actions">
      <button class="theme-toggle button button-small button-ghost" type="button" data-theme-toggle data-i18n-ignore="true" aria-label="Changer de style">Western</button>
      <a class="button button-small" href="https://discord.com/oauth2/authorize?client_id=1511426423376842922&permissions=1099780189206&integration_type=0&scope=bot+applications.commands">Inviter Sentinel</a>
      <a class="button button-ghost button-small" href="https://bot-service-discord-production.up.railway.app/dashboard">Voir le dashboard</a>
      <a class="header-link" href="https://bot-service-discord-production.up.railway.app/auth/login" data-discord-login>Connexion</a>
    </div>
  </header>
  <main class="not-found">
    <img src="assets/sentinel-mark.png" alt="" width="120" height="120">
    <p class="eyebrow">Sentinel</p>
    <h1>404</h1>
    <p>Cette page n’existe pas ou a été déplacée.</p>
    <a class="button" href="index.html">Retour au site</a>
    <a class="action-link" href="https://discord.gg/jzPqcUdVns" target="_blank" rel="noopener noreferrer">Serveur support</a>
  </main>
  <script src="theme.js?v=20260822-4"></script>
  <script src="i18n.js"></script>
  <script src="auth.js"></script>
</body>
</html>
